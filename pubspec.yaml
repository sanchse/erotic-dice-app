name: erotic_dice_app
description: A Flutter application for rolling erotic dice with customizable options.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.3.5
  flutter_svg: ^2.0.13
  audioplayers: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/dice_logo.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#000000"
  image: assets/launch.png
  android: true
  ios: false
  web: true
  android_12:
    image: assets/launch.png
    color: "#000000"
    icon_background_color: "#000000"

flutter:
  uses-material-design: true

  assets:
    - assets/kamasutra/
    - assets/sounds/
    - assets/launch.png
